name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    paths:
      - ".github/workflows/ci.yml"
      - ".swiftformat"
      - ".swiftlint.yml"
      - ".swift-version"
      - "**/*.swift"
      - "**/*.md"
      - "Scripts/**"
      - "Makefile"
      - "Tests/TMDbTests/Resources/**"
  workflow_dispatch:

concurrency:
  group: "ci-${{ github.head_ref || github.run_id }}"
  cancel-in-progress: true

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      swift: ${{ steps.filter.outputs.swift }}
      markdown: ${{ steps.filter.outputs.markdown }}
      versioncheck: ${{ steps.filter.outputs.versioncheck }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Detect file changes
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            swift:
              - '**/*.swift'
              - '.swiftformat'
              - '.swiftlint.yml'
              - '.swift-version'
              - 'Package.swift'
              - 'Scripts/**'
              - 'Makefile'
              - '.github/workflows/ci.yml'
              # Fixtures are a build input of the TMDbTests target via
              # .process("Resources"), so a fixture-only change must run the
              # unit suites as well as the fixture check.
              - 'Tests/TMDbTests/Resources/**'
              # The DocC catalog is an input of the curation check, so a PR that
              # only deletes a curation line must still run the Lint job.
              - 'Sources/TMDb/TMDb.docc/**'
              # README code samples are an input of the prose call-form check.
              - 'README.md'
            # Inputs of `Scripts/check-readme-version.py`, and only its inputs.
            # Split out of `swift` because `swift` gates five jobs — Lint,
            # build-test, the 4-way build-platforms matrix and build-test-linux —
            # so a CHANGELOG typo used to buy the entire Apple build matrix AND a
            # Linux container build. Do not add the DocC catalog or Sources here:
            # the prose call-form check needs those and deliberately stays on
            # `swift`.
            versioncheck:
              - 'README.md'
              - 'CHANGELOG.md'
            markdown:
              - 'README.md'
              - 'CLAUDE.md'
              # CODE_REVIEW.md and ISSUE_FILING.md are load-bearing specs that
              # several skills depend on, and lived in a lint blind spot.
              - '.github/*.md'
              - '**/*.docc/**/*.md'
              - '.claude/**/*.md'
              - 'knowledge/**/*.md'
              # Widened from `ci.yml` to every workflow so that a PR editing
              # codeql.yml or documentation.yml runs the workflow cache-key suite
              # below — they sit in no other filter key. No new output is needed:
              # Checkout and `Run-list builder check` are already gated on
              # `swift || markdown`, and `swift` stays false so Lint still lands
              # on ubuntu-latest. (This covers pull requests, which is where the
              # gate matters — `on.pull_request` carries no `paths:` filter, so
              # every PR evaluates these outputs. `on.push.paths` above still
              # lists only ci.yml, deliberately: widening it would fire the whole
              # six-job workflow on pushes touching integration.yml or claude.yml,
              # and every change reaches main through a PR that has already run
              # this suite.)
              - '.github/workflows/**'

  lint:
    name: Lint
    needs: changes
    if: always()
    runs-on: >-
      ${{
        (needs.changes.outputs.swift == 'true' || github.event_name == 'workflow_dispatch')
        && 'xcode-27' || 'ubuntu-latest'
      }}
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
      SWIFTLINT_VERSION: 0.63.2
      SWIFTFORMAT_VERSION: 0.61.1
    steps:
      # runner-safe: a bare `echo` — it needs no toolchain at all, and its
      # condition is the negation of the others, so it runs precisely when
      # nothing else in this job does.
      - name: No changes detected
        if: >-
          needs.changes.outputs.swift != 'true' && needs.changes.outputs.markdown != 'true'
          && needs.changes.outputs.versioncheck != 'true'
          && github.event_name != 'workflow_dispatch'
        run: echo "No Swift, Markdown or version-check changes detected, skipping lint"

      # runner-safe: gated more widely than `runs-on` selects on, deliberately.
      # Checkout must be gated on the UNION of every step's condition in this job:
      # a step gated on a key Checkout is not gated on runs with no repository on
      # disk (PR #476). So `markdown` is here for the run-list builder check, and
      # `versioncheck` for the README version check. Every swiftlint/swiftformat
      # step stays gated on `swift`, and the runner falls to ubuntu-latest when
      # `swift` is false, where python3 and git both ship.
      - name: Checkout
        if: >-
          needs.changes.outputs.swift == 'true' || needs.changes.outputs.markdown == 'true'
          || needs.changes.outputs.versioncheck == 'true'
          || github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v7

      - name: Install SwiftLint and SwiftFormat
        if: needs.changes.outputs.swift == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/lint-bin"

          curl -fsSL "https://github.com/realm/SwiftLint/releases/download/${SWIFTLINT_VERSION}/portable_swiftlint.zip" -o "${RUNNER_TEMP}/swiftlint.zip"
          unzip -oq "${RUNNER_TEMP}/swiftlint.zip" -d "${RUNNER_TEMP}/swiftlint"
          install "$(find "${RUNNER_TEMP}/swiftlint" -name swiftlint -type f | head -1)" "${RUNNER_TEMP}/lint-bin/swiftlint"

          curl -fsSL "https://github.com/nicklockwood/SwiftFormat/releases/download/${SWIFTFORMAT_VERSION}/swiftformat.zip" -o "${RUNNER_TEMP}/swiftformat.zip"
          unzip -oq "${RUNNER_TEMP}/swiftformat.zip" -d "${RUNNER_TEMP}/swiftformat"
          install "$(find "${RUNNER_TEMP}/swiftformat" -name swiftformat -type f | head -1)" "${RUNNER_TEMP}/lint-bin/swiftformat"

          echo "${RUNNER_TEMP}/lint-bin" >> "${GITHUB_PATH}"
          "${RUNNER_TEMP}/lint-bin/swiftlint" version
          "${RUNNER_TEMP}/lint-bin/swiftformat" --version

      - name: SwiftLint
        if: needs.changes.outputs.swift == 'true' || github.event_name == 'workflow_dispatch'
        run: swiftlint --strict .

      - name: SwiftFormat
        if: needs.changes.outputs.swift == 'true' || github.event_name == 'workflow_dispatch'
        run: swiftformat --lint .

      - name: Defaulted-witness check
        if: needs.changes.outputs.swift == 'true' || github.event_name == 'workflow_dispatch'
        run: python3 Scripts/check-defaulted-witnesses.py

      - name: Fixture check
        if: needs.changes.outputs.swift == 'true' || github.event_name == 'workflow_dispatch'
        run: python3 Scripts/check-fixtures.py

      - name: DocC curation check
        if: needs.changes.outputs.swift == 'true' || github.event_name == 'workflow_dispatch'
        run: python3 Scripts/check-docc-curation.py

      - name: Prose call-form check
        if: needs.changes.outputs.swift == 'true' || github.event_name == 'workflow_dispatch'
        run: python3 Scripts/check-prose-call-forms.py

      # runner-safe: may run on ubuntu-latest when only `versioncheck` fired.
      # `check-readme-version.py` is stdlib-only Python 3 over README.md and
      # CHANGELOG.md — it needs no Xcode, so a version-only change has no reason
      # to select the macOS runner. Checkout above is widened to match.
      - name: README version check
        if: >-
          needs.changes.outputs.swift == 'true' || needs.changes.outputs.versioncheck == 'true'
          || github.event_name == 'workflow_dispatch'
        run: python3 Scripts/check-readme-version.py

      # runner-safe: may run on ubuntu-latest when only `markdown` fired. Every
      # suite under Scripts/tests is stdlib-only Python 3 plus git, so no Xcode
      # is needed; Checkout above is widened to match.
      #
      # Mirrors `make lint-run-list`, which runs EVERY suite under Scripts/tests
      # via the wrapper's collection floor — the run-list builder's cases plus the
      # workflow cache-key / change-gate cases added for #448. No new paths-filter
      # output is needed: the builder lives under `Scripts/**` (already in the
      # `swift` key), its anti-drift cases read `.claude/**/*.md`, and the workflow
      # suite reads `.github/workflows/**` — both already in the `markdown` key.
      - name: Run-list builder check
        if: >-
          needs.changes.outputs.swift == 'true' || needs.changes.outputs.markdown == 'true'
          || github.event_name == 'workflow_dispatch'
        run: python3 Scripts/run-script-tests.py

  lint-markdown:
    name: Lint Markdown
    needs: changes
    if: always()
    runs-on: ubuntu-latest
    container:
      image: docker://ghcr.io/igorshubovych/markdownlint-cli:v0.48.0
    steps:
      - name: No changes detected
        if: needs.changes.outputs.markdown != 'true' && github.event_name != 'workflow_dispatch'
        run: echo "No Markdown changes detected, skipping lint"

      - name: Checkout
        if: needs.changes.outputs.markdown == 'true' || github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v7

      - name: Lint Markdown
        if: needs.changes.outputs.markdown == 'true' || github.event_name == 'workflow_dispatch'
        run: markdownlint "README.md" "CLAUDE.md" "**/*.docc/**/*.md" ".claude/**/*.md" "knowledge/**/*.md" ".github/*.md"

  build-test:
    name: Build and Test
    needs: changes
    if: always()
    runs-on: >-
      ${{
        (needs.changes.outputs.swift == 'true' || github.event_name == 'workflow_dispatch')
        && 'xcode-27' || 'ubuntu-latest'
      }}
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
    steps:
      - name: No changes detected
        if: needs.changes.outputs.swift != 'true' && github.event_name != 'workflow_dispatch'
        run: echo "No Swift changes detected, skipping build and test"

      - name: Checkout
        if: needs.changes.outputs.swift == 'true' || github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v7

      # Hash this workflow file, not `Package.resolved`: the latter is gitignored
      # (.gitignore:5) and never present in a fresh checkout, so `hashFiles`
      # returned '' and the key collapsed to the constant `macOS-swift-` —
      # byte-identical to its own restore prefix, hence an exact primary-key hit,
      # on which actions/cache SKIPS THE SAVE. That cache was written once in
      # April and never refreshed (#448). This file carries the DEVELOPER_DIR
      # Xcode pin, so a toolchain bump now invalidates the cache by itself. The
      # `-ci-` segment keeps this out of codeql.yml's namespace: both cache the
      # same two paths, and until #448 both resolved to the identical key.
      # Note the save recurs once per (workflow-hash, Package.swift-hash, ref) —
      # not per run — so a single entry per tuple is correct, not a regression.
      - name: Cache Swift packages
        if: needs.changes.outputs.swift == 'true' || github.event_name == 'workflow_dispatch'
        uses: actions/cache@v6
        with:
          path: |
            .build
            ~/Library/Developer/Xcode/DerivedData
          key: ${{ runner.os }}-swift-ci-${{ hashFiles('.github/workflows/ci.yml') }}-${{ hashFiles('Package.swift') }}
          restore-keys: |
            ${{ runner.os }}-swift-ci-${{ hashFiles('.github/workflows/ci.yml') }}-

      - name: Install xcsift
        if: needs.changes.outputs.swift == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          brew untap aws/tap azure/bicep 2>/dev/null || true
          brew install xcsift

      - name: Build
        if: needs.changes.outputs.swift == 'true' || github.event_name == 'workflow_dispatch'
        run: set -o pipefail && swift build --build-tests -Xswiftc -warnings-as-errors 2>&1 | xcsift -f github-actions --Werror

      - name: Test
        if: needs.changes.outputs.swift == 'true' || github.event_name == 'workflow_dispatch'
        run: set -o pipefail && swift test --filter "TMDbTests|TMDbTestingTests|TMDbIntelligenceTests|TMDbIntelligenceTestingTests" --enable-code-coverage --xunit-output junit.xml 2>&1 | xcsift -f github-actions

      - name: Prepare Code Coverage
        if: needs.changes.outputs.swift == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          BIN_PATH=$(swift build --show-bin-path)
          PROFDATA="$(dirname "$(swift test --show-codecov-path)")/default.profdata"

          OBJECTS=()
          for target in TMDbTests TMDbTestingTests TMDbIntelligenceTests TMDbIntelligenceTestingTests; do
            binary="${BIN_PATH}/${target}.xctest/Contents/MacOS/${target}"
            if [ ! -f "${binary}" ]; then
              echo "::error::Test binary not found: ${binary}"
              exit 1
            fi
            OBJECTS+=(-object "${binary}")
          done

          xcrun llvm-cov export -format="lcov" "${OBJECTS[@]}" \
            -instr-profile "${PROFDATA}" > info.lcov

          if [ ! -s info.lcov ]; then
            echo "::error::Coverage export produced an empty report"
            exit 1
          fi

      - name: Upload coverage reports to Codecov
        if: needs.changes.outputs.swift == 'true' || github.event_name == 'workflow_dispatch'
        uses: codecov/codecov-action@v7
        with:
          files: info.lcov
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload test results to Codecov
        if: >-
          !cancelled()
          && (needs.changes.outputs.swift == 'true' || github.event_name == 'workflow_dispatch')
        uses: codecov/codecov-action@v7
        with:
          files: ./junit-swift-testing.xml
          report_type: test_results
          flags: unit-tests
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Build for Release
        if: needs.changes.outputs.swift == 'true' || github.event_name == 'workflow_dispatch'
        run: set -o pipefail && swift build -c release -Xswiftc -warnings-as-errors 2>&1 | xcsift -f github-actions --Werror

  build-platforms:
    name: Build (${{ matrix.name }})
    needs: changes
    if: always()
    runs-on: >-
      ${{
        (needs.changes.outputs.swift == 'true' || github.event_name == 'workflow_dispatch')
        && 'xcode-27' || 'ubuntu-latest'
      }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: iOS
            destination: generic/platform=iOS Simulator
          - name: tvOS
            destination: generic/platform=tvOS Simulator
          - name: watchOS
            destination: generic/platform=watchOS Simulator
          - name: visionOS
            destination: generic/platform=visionOS Simulator
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
    steps:
      - name: No changes detected
        if: needs.changes.outputs.swift != 'true' && github.event_name != 'workflow_dispatch'
        run: echo "No Swift changes detected, skipping ${{ matrix.name }} build"

      - name: Checkout
        if: needs.changes.outputs.swift == 'true' || github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v7

      - name: Cache Xcode DerivedData
        if: needs.changes.outputs.swift == 'true' || github.event_name == 'workflow_dispatch'
        uses: actions/cache@v6
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          key: ${{ runner.os }}-xcode-${{ matrix.name }}-${{ hashFiles('.github/workflows/ci.yml') }}-${{ hashFiles('Package.swift') }}
          restore-keys: |
            ${{ runner.os }}-xcode-${{ matrix.name }}-${{ hashFiles('.github/workflows/ci.yml') }}-

      - name: Install xcsift
        if: needs.changes.outputs.swift == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          brew untap aws/tap azure/bicep 2>/dev/null || true
          brew install xcsift

      - name: Build
        if: needs.changes.outputs.swift == 'true' || github.event_name == 'workflow_dispatch'
        run: set -o pipefail && xcodebuild build -scheme TMDb-Package -destination '${{ matrix.destination }}' 2>&1 | xcsift -f github-actions --Werror

  build-test-linux:
    name: Build and Test (Linux)
    needs: changes
    if: always()
    runs-on: ubuntu-latest
    container: swift:6.1-jammy
    steps:
      - name: No changes detected
        if: needs.changes.outputs.swift != 'true' && github.event_name != 'workflow_dispatch'
        run: echo "No Swift changes detected, skipping build and test"

      - name: Checkout
        if: needs.changes.outputs.swift == 'true' || github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v7

      - name: Build
        if: needs.changes.outputs.swift == 'true' || github.event_name == 'workflow_dispatch'
        run: swift build --build-tests -Xswiftc -warnings-as-errors

      - name: Test
        if: needs.changes.outputs.swift == 'true' || github.event_name == 'workflow_dispatch'
        run: swift test --skip-build --filter "TMDbTests|TMDbTestingTests|TMDbIntelligenceTests|TMDbIntelligenceTestingTests"

      - name: Build for Release
        if: needs.changes.outputs.swift == 'true' || github.event_name == 'workflow_dispatch'
        run: swift build -c release -Xswiftc -warnings-as-errors

  # Day-precision dates are pinned to GMT in both directions (see ADR-0029).
  # Every assertion that proves it reads `== <GMT value>`, which passes
  # trivially on a UTC runner whether or not the production code pins a zone —
  # so the proof is this job, not the assertions. Both zones are needed and
  # they catch different halves: a negative offset catches the outbound
  # formatter (a GMT-midnight instant formats as the *previous* day), a
  # positive offset catches year-boundary maths (`startOfYear` lands in the
  # previous year). Delete this job and a whole class of test silently stops
  # proving anything.
  unit-test-timezones:
    name: Test (${{ matrix.timezone }})
    needs: changes
    if: always()
    runs-on: ubuntu-latest
    container: swift:6.1-jammy
    strategy:
      fail-fast: false
      matrix:
        timezone: [America/Los_Angeles, Pacific/Auckland]
    env:
      TZ: ${{ matrix.timezone }}
      # Switches on a test that asserts Foundation itself sees a non-UTC offset.
      # The bash guard below reads glibc; the tests read
      # swift-corelibs-foundation. Those are different runtimes reading the same
      # variable, and only the second one matters here.
      TMDB_EXPECT_NON_UTC: "1"
    steps:
      - name: No changes detected
        if: needs.changes.outputs.swift != 'true' && github.event_name != 'workflow_dispatch'
        run: echo "No Swift changes detected, skipping ${{ matrix.timezone }} test run"

      - name: Checkout
        if: needs.changes.outputs.swift == 'true' || github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v7

      # This job's whole value is running at a non-UTC offset. If tzdata is
      # absent or the identifier fails to resolve, the zone silently falls back
      # to UTC, every assertion still passes, and a green here would mean
      # nothing — the same silent-green failure the job exists to prevent.
      # Assert the postcondition rather than assuming it.
      - name: Verify the container honours TZ
        if: needs.changes.outputs.swift == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          offset=$(date +%z)
          echo "TZ=$TZ resolved to offset $offset"
          if [ "$offset" = "+0000" ]; then
            echo "::error::TZ=$TZ was not applied — this job would run at UTC and prove nothing"
            exit 1
          fi

      - name: Build
        if: needs.changes.outputs.swift == 'true' || github.event_name == 'workflow_dispatch'
        run: swift build --build-tests -Xswiftc -warnings-as-errors

      - name: Test
        if: needs.changes.outputs.swift == 'true' || github.event_name == 'workflow_dispatch'
        run: swift test --skip-build --filter "TMDbTests|TMDbTestingTests|TMDbIntelligenceTests|TMDbIntelligenceTestingTests"

  ci:
    name: CI
    if: always()
    needs: [changes, lint, lint-markdown, build-test, build-platforms, build-test-linux, unit-test-timezones]
    runs-on: ubuntu-latest
    steps:
      - name: Check job results
        run: |
          results=( \
            "${{ needs.changes.result }}" \
            "${{ needs.lint.result }}" \
            "${{ needs.lint-markdown.result }}" \
            "${{ needs.build-test.result }}" \
            "${{ needs.build-platforms.result }}" \
            "${{ needs.build-test-linux.result }}" \
            "${{ needs.unit-test-timezones.result }}" \
          )
          for result in "${results[@]}"; do
            if [[ "$result" == "failure" || "$result" == "cancelled" ]]; then
              echo "Job failed or cancelled: $result"
              exit 1
            fi
          done
